<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SA Youth Learning — Free Skills Development</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#fafbfc;color:#1a2b3c;line-height:1.6;-webkit-font-smoothing:antialiased}
:root{--navy-900:#0a1f33;--navy-800:#102b45;--navy-700:#1a3d5c;--navy-600:#245273;--navy-500:#2f6a91;--navy-100:#e8eef4;--navy-50:#f3f7fa;--teal-600:#0d7377;--teal-500:#14919b;--teal-100:#d4eef0;--gold-600:#b8860b;--gold-500:#d4a017;--gold-100:#faf3e0;--gray-900:#1a2b3c;--gray-700:#45566b;--gray-500:#6b7c93;--gray-300:#cbd5e0;--gray-200:#e2e8f0;--gray-100:#f1f5f9;--white:#fff;--success:#0d7c4d;--success-bg:#e6f4ec;--danger:#a83232;--danger-bg:#f9e8e8;--warning:#b8860b;--warning-bg:#faf3e0;--shadow-sm:0 2px 8px rgba(10,31,51,.08);--shadow-md:0 8px 24px rgba(10,31,51,.1);--shadow-lg:0 16px 48px rgba(10,31,51,.14);--radius-sm:8px;--radius-md:14px;--radius-lg:20px;--radius-xl:28px;--transition:all .22s cubic-bezier(.4,0,.2,1)}
.container{max-width:1240px;margin:0 auto;padding:0 24px}
.site-header{position:sticky;top:0;z-index:500;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--gray-200)}
.navbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;padding:14px 0}
.logo{font-family:'Playfair Display',serif;font-size:1.55rem;font-weight:700;color:var(--navy-800);display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.logo-mark{width:40px;height:40px;background:linear-gradient(135deg,var(--navy-700),var(--teal-600));border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--gold-500);font-size:1.1rem;box-shadow:var(--shadow-sm)}
.nav-links{display:flex;flex-wrap:wrap;align-items:center;gap:4px 24px;list-style:none;font-weight:500}
.nav-links a{text-decoration:none;color:var(--gray-700);transition:var(--transition);font-size:.92rem;white-space:nowrap;padding:6px 0}
.nav-links a:hover{color:var(--navy-800)}
.nav-actions{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;border-radius:var(--radius-sm);padding:10px 20px;text-decoration:none;font-size:.9rem;transition:var(--transition);border:none;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap}
.btn-primary{background:var(--navy-700);color:#fff;box-shadow:var(--shadow-sm)}
.btn-primary:hover{background:var(--navy-800);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn-secondary{background:transparent;color:var(--navy-700);border:1.5px solid var(--gray-300)}
.btn-secondary:hover{border-color:var(--navy-700);background:var(--navy-50)}
.btn-accent{background:var(--gold-500);color:var(--navy-900);box-shadow:var(--shadow-sm)}
.btn-accent:hover{background:var(--gold-600);transform:translateY(-1px)}
.btn-teal{background:var(--teal-600);color:#fff;box-shadow:var(--shadow-sm)}
.btn-teal:hover{background:var(--teal-500);transform:translateY(-1px)}
.btn-large{padding:14px 32px;font-size:1rem}
.btn-sm{padding:7px 14px;font-size:.82rem}
.btn-block{width:100%}
.hero{padding:72px 0 64px;background:linear-gradient(160deg,var(--navy-50) 0%,#fff 60%);border-bottom:1px solid var(--gray-200)}
.hero-grid{display:flex;align-items:center;gap:64px}
.hero-content{flex:1 1 520px}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--teal-100);color:var(--teal-600);font-weight:600;font-size:.78rem;padding:6px 14px;border-radius:20px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px}
.hero-content h1{font-family:'Playfair Display',serif;font-size:3.1rem;font-weight:700;line-height:1.15;color:var(--navy-900);margin-bottom:20px}
.hero-content p{font-size:1.1rem;color:var(--gray-700);margin-bottom:32px;max-width:560px;line-height:1.7}
.hero-actions{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.hero-visual{flex:1 1 380px;min-height:320px;border-radius:var(--radius-xl);background:linear-gradient(135deg,var(--navy-700),var(--teal-600));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--shadow-lg)}
.hero-visual i{font-size:5rem;opacity:.9}
.section{padding:72px 0}
.section-alt{background:var(--navy-50)}
.section-white{background:#fff}
.section-header{text-align:center;max-width:680px;margin:0 auto 48px}
.section-eyebrow{display:inline-block;font-weight:600;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-600);margin-bottom:12px}
.section-title{font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:700;color:var(--navy-900);margin-bottom:14px;line-height:1.25}
.section-sub{color:var(--gray-500);font-size:1.02rem}
.course-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px}
.course-card{background:#fff;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);transition:var(--transition);border:1px solid var(--gray-200);display:flex;flex-direction:column}
.course-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--teal-500)}
.course-image{height:170px;background-size:cover;background-position:center;position:relative;background-color:var(--navy-100)}
.course-image::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(10,31,51,.5),transparent 60%)}
.course-icon-badge{position:absolute;bottom:16px;left:18px;width:48px;height:48px;background:rgba(255,255,255,.95);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--navy-700);font-size:1.3rem;z-index:2}
.course-content{padding:24px;display:flex;flex-direction:column;flex:1}
.course-card h3{font-size:1.2rem;font-weight:700;color:var(--navy-900);margin-bottom:8px}
.course-meta{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--gray-500);margin-bottom:14px}
.course-desc{color:var(--gray-500);font-size:.9rem;margin-bottom:20px;flex:1}
.empty-state{grid-column:1/-1;text-align:center;padding:64px 24px;background:#fff;border-radius:var(--radius-lg);border:2px dashed var(--gray-300)}
.empty-state i{font-size:3rem;color:var(--gray-300);margin-bottom:16px}
.empty-state h3{color:var(--gray-700);font-size:1.2rem;margin-bottom:8px}
.steps-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px}
.step-item{text-align:center;background:#fff;padding:36px 22px;border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);border:1px solid var(--gray-200)}
.step-number{width:52px;height:52px;background:linear-gradient(135deg,var(--navy-700),var(--teal-600));color:#fff;font-weight:700;font-size:1.3rem;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.step-item h4{font-size:1.05rem;margin-bottom:10px;color:var(--navy-900)}
.step-item p{color:var(--gray-500);font-size:.88rem}
.about-panel{background:linear-gradient(135deg,var(--navy-800),var(--navy-700));border-radius:var(--radius-xl);padding:56px 48px;color:#fff;display:flex;flex-wrap:wrap;gap:48px;align-items:center;box-shadow:var(--shadow-lg)}
.about-text{flex:2 1 420px}
.about-text h2{font-family:'Playfair Display',serif;font-size:2rem;margin-bottom:18px;color:#fff}
.about-text p{color:rgba(255,255,255,.85);font-size:1rem;margin-bottom:16px;line-height:1.7}
.about-stats{display:flex;flex-wrap:wrap;gap:36px;margin-top:28px}
.stat-number{font-size:2rem;font-weight:700;color:var(--gold-500);font-family:'Playfair Display',serif}
.stat-label{font-size:.85rem;color:rgba(255,255,255,.7)}
.about-visual{flex:1 1 240px;height:220px;border-radius:var(--radius-lg);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:4rem;color:var(--gold-500)}
.register-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.register-info h2{font-family:'Playfair Display',serif;font-size:2rem;color:var(--navy-900);margin-bottom:16px}
.register-info > p{color:var(--gray-500);font-size:1rem;margin-bottom:28px;line-height:1.7}
.bank-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:28px;box-shadow:var(--shadow-sm);border-top:4px solid var(--gold-500)}
.bank-card h4{font-size:1.05rem;font-weight:700;color:var(--navy-900);margin-bottom:18px;display:flex;align-items:center;gap:10px}
.bank-card h4 i{color:var(--gold-500)}
.bank-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--gray-100);font-size:.9rem}
.bank-row:last-child{border-bottom:none}
.bank-label{color:var(--gray-500);font-weight:500}
.bank-value{font-weight:700;color:var(--navy-900);text-align:right}
.bank-note{background:var(--gold-100);border-radius:var(--radius-sm);padding:14px 16px;font-size:.85rem;color:#7a5c0a;display:flex;gap:10px;align-items:flex-start;margin-top:18px;line-height:1.5}
.bank-note i{color:var(--gold-600);font-size:1rem;margin-top:2px}
.form-card{background:#fff;border-radius:var(--radius-lg);padding:36px;box-shadow:var(--shadow-md);border:1px solid var(--gray-200)}
.form-card h3{font-size:1.4rem;font-weight:700;color:var(--navy-900);margin-bottom:6px}
.form-card > p{color:var(--gray-500);margin-bottom:24px;font-size:.9rem}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-weight:600;font-size:.85rem;color:var(--navy-900);margin-bottom:7px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 16px;border-radius:var(--radius-sm);border:1.5px solid var(--gray-300);font-family:'Inter',sans-serif;font-size:.95rem;transition:var(--transition);background:#fff;color:var(--gray-900)}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--teal-500);box-shadow:0 0 0 3px rgba(20,145,155,.12)}
.form-group input::placeholder{color:var(--gray-300)}
.form-group textarea{resize:vertical;min-height:90px}
.form-hint{font-size:.78rem;color:var(--gray-500);margin-top:5px}
.cta-banner{background:linear-gradient(135deg,var(--teal-600),var(--navy-700));border-radius:var(--radius-xl);padding:56px 48px;text-align:center;color:#fff;margin:72px 0;box-shadow:var(--shadow-lg)}
.cta-banner h2{font-family:'Playfair Display',serif;font-size:2.1rem;margin-bottom:14px}
.cta-banner p{font-size:1.05rem;opacity:.9;max-width:560px;margin:0 auto 28px}
.site-footer{background:var(--navy-900);color:rgba(255,255,255,.75);padding:56px 0 0}
.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:40px;margin-bottom:40px}
.footer-brand .logo{color:#fff;margin-bottom:16px;font-size:1.3rem}
.footer-brand p{font-size:.88rem;line-height:1.7;color:rgba(255,255,255,.6);max-width:300px}
.footer-col h4{color:#fff;font-size:.9rem;font-weight:600;margin-bottom:18px;letter-spacing:.04em;text-transform:uppercase}
.footer-col ul{list-style:none}
.footer-col li{margin-bottom:11px}
.footer-col a{color:rgba(255,255,255,.65);text-decoration:none;font-size:.88rem}
.footer-col a:hover{color:var(--gold-500)}
.footer-bottom{border-top:1px solid rgba(255,255,255,.1);padding:24px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;font-size:.82rem;color:rgba(255,255,255,.5)}
.admin-tab-bar{background:var(--navy-800);border-top:3px solid var(--gold-500)}
.admin-tab-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;padding:16px 0}
.admin-tab-left{display:flex;align-items:center;gap:14px}
.admin-tab-icon{width:44px;height:44px;background:linear-gradient(135deg,var(--gold-500),var(--gold-600));color:var(--navy-900);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.admin-tab-text h4{color:#fff;font-size:.98rem;margin-bottom:2px}
.admin-tab-text p{color:rgba(255,255,255,.6);font-size:.82rem}
.admin-tab-btn{background:var(--gold-500);color:var(--navy-900);border:none;padding:11px 26px;border-radius:var(--radius-sm);font-weight:700;font-size:.9rem;cursor:pointer;font-family:'Inter',sans-serif;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow-sm)}
.admin-tab-btn:hover{background:var(--gold-600)}
.admin-tab-btn.logged-in{background:var(--success);color:#fff}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,31,51,.7);z-index:1000;overflow-y:auto;padding:40px 20px;backdrop-filter:blur(6px)}
.modal-overlay.active{display:block}
.modal{background:#fff;border-radius:var(--radius-xl);max-width:960px;margin:0 auto;box-shadow:var(--shadow-lg);overflow:hidden;animation:modalIn .28s cubic-bezier(.4,0,.2,1)}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-header{background:var(--navy-800);color:#fff;padding:24px 32px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.modal-header h2{font-size:1.35rem;font-weight:700}
.modal-close{background:rgba(255,255,255,.1);border:none;color:#fff;width:36px;height:36px;border-radius:var(--radius-sm);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:rgba(255,255,255,.25)}
.modal-body{padding:32px}
.modal-tabs{display:flex;gap:4px;border-bottom:2px solid var(--gray-200);margin-bottom:28px;flex-wrap:wrap}
.modal-tab{background:none;border:none;padding:11px 18px;font-family:'Inter',sans-serif;font-size:.88rem;font-weight:600;color:var(--gray-500);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px}
.modal-tab:hover{color:var(--navy-800)}
.modal-tab.active{color:var(--teal-600);border-bottom-color:var(--teal-500)}
.tab-content{display:none}
.tab-content.active{display:block}
.content-item{background:var(--gray-100);border-radius:var(--radius-md);padding:20px 22px;margin-bottom:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-left:4px solid var(--teal-500)}
.content-item-icon{width:44px;height:44px;border-radius:var(--radius-sm);background:var(--navy-700);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.content-item-body{flex:1;min-width:200px}
.content-item-body h4{font-size:1rem;margin-bottom:4px;color:var(--navy-900);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.content-item-body p{font-size:.85rem;color:var(--gray-500)}
.pdf-tag{background:var(--danger-bg);color:var(--danger);font-size:.65rem;padding:2px 8px;border-radius:6px;font-weight:700}
.empty-tab{text-align:center;padding:48px 24px;color:var(--gray-500)}
.empty-tab i{font-size:2.5rem;color:var(--gray-300);margin-bottom:14px;display:block}
.quiz-question{background:var(--gray-100);border-radius:var(--radius-md);padding:22px;margin-bottom:18px}
.quiz-question h4{font-size:.98rem;margin-bottom:14px;color:var(--navy-900);line-height:1.5}
.quiz-option{display:flex;align-items:center;gap:12px;padding:11px 15px;margin-bottom:8px;border-radius:var(--radius-sm);background:#fff;border:1.5px solid var(--gray-300);cursor:pointer;font-size:.92rem}
.quiz-option:hover{border-color:var(--teal-500);background:var(--navy-50)}
.quiz-option input{accent-color:var(--teal-600);width:17px;height:17px;cursor:pointer}
.quiz-option.selected{border-color:var(--teal-600);background:var(--teal-100)}
.quiz-result{padding:22px;border-radius:var(--radius-md);text-align:center;margin-top:20px;display:none}
.quiz-result.pass{background:var(--success-bg);border:2px solid var(--success);display:block}
.quiz-result.fail{background:var(--danger-bg);border:2px solid var(--danger);display:block}
.quiz-result h3{margin-bottom:8px;font-size:1.15rem}
.quiz-result.pass h3{color:var(--success)}
.quiz-result.fail h3{color:var(--danger)}
.facilitator-box{background:var(--navy-50);border-radius:var(--radius-md);padding:28px;border:1px solid var(--gray-200)}
.facilitator-box h3{font-size:1.15rem;margin-bottom:8px;color:var(--navy-900);display:flex;align-items:center;gap:10px}
.facilitator-box h3 i{color:var(--teal-600)}
.facilitator-box > p{color:var(--gray-500);font-size:.9rem;margin-bottom:22px}
.facilitator-success{background:var(--success-bg);border:1.5px solid var(--success);border-radius:var(--radius-md);padding:22px;text-align:center;margin-top:20px;display:none}
.cert-waiting{text-align:center;padding:48px 24px;background:var(--gray-100);border-radius:var(--radius-md);border:2px dashed var(--gray-300)}
.cert-waiting i{font-size:2.5rem;color:var(--gold-500);margin-bottom:16px;display:block}
.cert-waiting h3{color:var(--navy-900);margin-bottom:10px;font-size:1.15rem}
.cert-waiting p{color:var(--gray-500);max-width:480px;margin:0 auto;font-size:.9rem}
.cert-ready{text-align:center}
.cert-ready-icon{width:72px;height:72px;background:var(--success-bg);color:var(--success);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 20px}
.admin-panel{background:var(--navy-900);border-radius:var(--radius-lg);padding:28px;color:#fff}
.admin-panel-header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.admin-panel-header i{color:var(--gold-500);font-size:1.3rem}
.admin-panel-header h3{font-size:1.2rem;font-weight:700}
.admin-panel > p{color:rgba(255,255,255,.6);font-size:.88rem;margin-bottom:24px}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.admin-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius-md);padding:22px}
.admin-card h4{font-size:.95rem;margin-bottom:10px;color:var(--gold-500);display:flex;align-items:center;gap:8px}
.admin-card p{font-size:.8rem;color:rgba(255,255,255,.55);margin-bottom:14px}
.admin-input,.admin-select,.admin-textarea{width:100%;padding:10px 13px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-family:'Inter',sans-serif;font-size:.85rem;margin-bottom:9px}
.admin-textarea{resize:vertical;min-height:70px}
.admin-input::placeholder,.admin-textarea::placeholder{color:rgba(255,255,255,.35)}
.admin-select option{color:var(--gray-900)}
.admin-file{width:100%;padding:9px 12px;border-radius:var(--radius-sm);border:1px dashed rgba(255,255,255,.25);background:rgba(255,255,255,.04);color:rgba(255,255,255,.6);font-size:.8rem;margin-bottom:9px;cursor:pointer}
.admin-file::-webkit-file-upload-button{background:var(--gold-500);color:var(--navy-900);border:none;padding:6px 14px;border-radius:20px;font-weight:600;font-size:.78rem;cursor:pointer;margin-right:10px;font-family:'Inter',sans-serif}
.admin-btn{background:var(--gold-500);color:var(--navy-900);border:none;padding:10px 18px;border-radius:var(--radius-sm);font-weight:600;font-size:.82rem;cursor:pointer;font-family:'Inter',sans-serif;width:100%;display:flex;align-items:center;justify-content:center;gap:7px}
.admin-btn:hover{background:var(--gold-600)}
.admin-status{margin-top:18px;padding:13px 18px;border-radius:var(--radius-sm);font-size:.85rem;display:none}
.admin-status.success{background:rgba(13,124,77,.2);border:1px solid var(--success);color:#7fdfa8;display:block}
.admin-status.error{background:rgba(168,50,50,.2);border:1px solid var(--danger);color:#f5a3a3;display:block}
.admin-login-overlay,.user-login-overlay{display:none;position:fixed;inset:0;background:rgba(10,31,51,.85);z-index:2000;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.admin-login-overlay.active,.user-login-overlay.active{display:flex}
.admin-login-box,.user-login-box{background:#fff;border-radius:var(--radius-xl);padding:44px 40px;max-width:420px;width:100%;box-shadow:var(--shadow-lg);text-align:center;animation:modalIn .28s ease}
.admin-login-box .lock-icon,.user-login-box .user-icon{width:64px;height:64px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin:0 auto 20px}
.admin-login-box .lock-icon{background:linear-gradient(135deg,var(--navy-700),var(--teal-600));color:var(--gold-500)}
.user-login-box .user-icon{background:linear-gradient(135deg,var(--teal-600),var(--navy-700));color:#fff}
.admin-login-box h3,.user-login-box h3{font-size:1.3rem;color:var(--navy-900);margin-bottom:6px}
.admin-login-box > p,.user-login-box > p{color:var(--gray-500);font-size:.88rem;margin-bottom:26px}
.admin-login-box input,.user-login-box input{width:100%;padding:12px 16px;border-radius:var(--radius-sm);border:1.5px solid var(--gray-300);font-family:'Inter',sans-serif;font-size:.95rem;margin-bottom:14px}
.admin-login-box input:focus,.user-login-box input:focus{outline:none;border-color:var(--teal-500);box-shadow:0 0 0 3px rgba(20,145,155,.12)}
.admin-login-error,.user-login-error{color:var(--danger);font-size:.82rem;margin-bottom:14px;display:none;font-weight:600}
.admin-login-error.show,.user-login-error.show{display:block}
.admin-login-close,.user-login-close{background:none;border:none;color:var(--gray-500);font-size:.85rem;cursor:pointer;margin-top:14px}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--navy-900);color:#fff;padding:14px 24px;border-radius:var(--radius-sm);font-size:.9rem;font-weight:500;box-shadow:var(--shadow-lg);z-index:3000;transition:transform .3s;max-width:90%;display:flex;align-items:center;gap:10px}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{border-left:4px solid var(--success)}
.toast.error{border-left:4px solid var(--danger)}
.toast.info{border-left:4px solid var(--teal-500)}
.user-badge{display:flex;align-items:center;gap:8px;background:var(--teal-100);color:var(--teal-600);padding:6px 14px;border-radius:20px;font-size:.82rem;font-weight:600}
.reg-list{display:flex;flex-direction:column;gap:10px;max-height:500px;overflow-y:auto}
.reg-item{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius-sm);padding:14px 16px;font-size:.82rem}
.reg-item-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.reg-item-name{font-weight:700;color:var(--gold-500);font-size:.88rem}
.reg-item-status{font-size:.7rem;padding:3px 9px;border-radius:10px;font-weight:700;text-transform:uppercase}
.reg-item-status.pending{background:var(--warning-bg);color:var(--warning)}
.reg-item-status.approved{background:var(--success-bg);color:var(--success)}
.reg-item-detail{color:rgba(255,255,255,.6);margin-bottom:3px}
.reg-item-detail strong{color:rgba(255,255,255,.85)}
